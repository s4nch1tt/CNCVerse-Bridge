name: Deploy CNCVerse Bridge 24/7

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: deploy-bridge-24-7
  cancel-in-progress: false

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Restore Bridge Data & Extensions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION_SETTINGS: ${{ secrets.EXTENSION_SETTINGS }}
          INSTALLED_PLUGINS: ${{ secrets.INSTALLED_PLUGINS }}
          REPO_URLS: ${{ secrets.REPO_URLS }}
        run: |
          mkdir -p ~/.cncverse
          mkdir -p ~/.cncverse_bridge/plugins

          # 1. Restore from bridge-data git branch if exists
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin bridge-data:bridge-data 2>/dev/null || true
          if git rev-parse --verify bridge-data >/dev/null 2>&1; then
            git archive bridge-data | tar -x -C ~/.cncverse_bridge 2>/dev/null || true
            if [ -f ~/.cncverse_bridge/ext_settings.txt ]; then
              cp ~/.cncverse_bridge/ext_settings.txt ~/.cncverse/ext_settings.txt
            fi
            if [ -f ~/.cncverse_bridge/repos.txt ]; then
              cp ~/.cncverse_bridge/repos.txt ~/.cncverse/repos.txt
            fi
            echo "✅ Restored installed plugins and settings from bridge-data branch!"
          fi

          # 2. Apply GitHub secrets (if provided)
          if [ -n "$EXTENSION_SETTINGS" ]; then
            echo "$EXTENSION_SETTINGS" > ~/.cncverse/ext_settings.txt
            echo "Loaded EXTENSION_SETTINGS secret into ~/.cncverse/ext_settings.txt"
          fi
          if [ -n "$INSTALLED_PLUGINS" ]; then
            echo "$INSTALLED_PLUGINS" > ~/.cncverse_bridge/installed_plugins.json
            echo "Loaded INSTALLED_PLUGINS secret into ~/.cncverse_bridge/installed_plugins.json"
          fi
          if [ -n "$REPO_URLS" ]; then
            echo "$REPO_URLS" > ~/.cncverse/repos.txt
            echo "Loaded REPO_URLS secret into ~/.cncverse/repos.txt"
          fi

      - name: Launch Server & Cloudflare Tunnel
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL || secrets.WORKER_URL || secrets.CLOUDFLARE_WORKER_URL || 'https://late-disk-c21b.d387933639.workers.dev' }}
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET || secrets.WORKER_SECRET || 'cncverse_secret_2026' }}
          AUTO_INSTALL_EXTENSIONS: ${{ secrets.AUTO_INSTALL_EXTENSIONS || '' }}
          HEADLESS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Launch Continuous Persistence Sync Daemon (syncs every 60s to bridge-data branch)
          (
            while true; do
              sleep 60
              if [ -d "$HOME/.cncverse_bridge" ]; then
                TMP_DATA=$(mktemp -d)
                cp -r "$HOME/.cncverse_bridge"/* "$TMP_DATA/" 2>/dev/null || true
                if [ -f "$HOME/.cncverse/ext_settings.txt" ]; then
                  cp "$HOME/.cncverse/ext_settings.txt" "$TMP_DATA/" 2>/dev/null || true
                fi
                if [ -f "$HOME/.cncverse/repos.txt" ]; then
                  cp "$HOME/.cncverse/repos.txt" "$TMP_DATA/" 2>/dev/null || true
                fi
                cd "$TMP_DATA"
                git init -q
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git checkout -q -B bridge-data
                git add -A
                if ! git diff-index --quiet HEAD 2>/dev/null; then
                  git commit -q -m "chore: auto-sync installed extensions & settings [skip ci]"
                  git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bridge-data >/dev/null 2>&1 || true
                fi
                cd - >/dev/null
                rm -rf "$TMP_DATA"
              fi
            done
          ) &
          SYNC_PID=$!
          echo "Compiling CNCVerse Bridge Desktop module..."
          ./gradlew :desktopApp:compileKotlinDesktop --no-daemon

          echo "Starting Headless Server in background..."
          ./gradlew :desktopApp:run --args="headless" --no-daemon > server.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for Stremio HTTP server to bind port 8080..."
          SERVER_UP=0
          for i in {1..60}; do
            if curl -s http://127.0.0.1:8080/manifest.json > /dev/null; then
              echo "✅ Stremio HTTP server is UP and responding on port 8080!"
              SERVER_UP=1
              break
            fi
            sleep 2
          done

          if [ "$SERVER_UP" -eq 0 ]; then
            echo "❌ Stremio HTTP server did not respond on port 8080 in time. Server log:"
            cat server.log
          fi

          echo "Launching Cloudflare Tunnel..."
          cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > tunnel.log 2>&1 &

          echo "Waiting for Cloudflare Tunnel URL..."
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -Eo 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "=========================================================="
          echo "🚀 Live Cloudflare Tunnel URL: $TUNNEL_URL"
          if [ -n "$CF_WORKER_URL" ]; then
            echo "🌐 Permanent Gateway URL:      $CF_WORKER_URL"
            echo "📺 Stremio Addon Install URL:  $CF_WORKER_URL/manifest.json"
          fi
          echo "=========================================================="

          if [ -n "$CF_WORKER_URL" ]; then
            RESPONSE=$(curl -s -X POST "$CF_WORKER_URL/__update_backend" \
              -H "Authorization: Bearer $CF_WORKER_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"backend_url\": \"$TUNNEL_URL\"}")
            echo "✅ Synced tunnel URL with Cloudflare Worker: $CF_WORKER_URL (Response: $RESPONSE)"

            # Render GitHub Actions Step Summary markdown
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "## 🎬 CNCVerse Bridge 24/7 is LIVE!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              echo "| 🌐 **Permanent Gateway** | \`$CF_WORKER_URL\` |" >> $GITHUB_STEP_SUMMARY
              echo "| 📺 **Stremio Addon URL** | [\`$CF_WORKER_URL/manifest.json\`]($CF_WORKER_URL/manifest.json) |" >> $GITHUB_STEP_SUMMARY
              echo "| ⚡ **Direct Cloudflare Tunnel** | [\`$TUNNEL_URL\`]($TUNNEL_URL) |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "👉 **Install in Stremio:** Paste \`$CF_WORKER_URL/manifest.json\` into the Stremio Addons search bar." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ CF_WORKER_URL secret is NOT set in GitHub Repository Secrets! Please add CF_WORKER_URL and CF_WORKER_SECRET in Settings -> Secrets and variables -> Actions."
          fi

          # Keep runner alive for 4 hours 50 minutes (17400s)
          echo "CNCVerse Bridge is running in 24/7 mode..."
          sleep 17400

          # Seamlessly trigger next cycle before this job ends
          echo "Triggering next 24/7 cycle..."
          gh workflow run "Deploy CNCVerse Bridge 24/7" || true
